name: Release

# Dogfood release: this workflow builds AND publishes Tamp.Spfx
# *using Tamp itself*. The dotnet-tamp global tool is installed and runs
# the Build.cs targets — same pattern Tamp's own self-hosted CI uses.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, pack but do NOT push to nuget.org'
        type: boolean
        default: true

# Read-only by default. Only the publish job can mint the OIDC token (see its permissions below).
permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  # Use the published Tamp.Core via PackageReference (not sibling-clone
  # ProjectReference) — this is what makes the dogfood story load-bearing.
  TampCoreMode: package

jobs:
  publish:
    name: pack + push to nuget.org via Tamp
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write   # create the GitHub Release for this tag (tamp#159); read would not suffice
      issues: write     # announce the shipped version on the issues this release carries (tamp#164)
      id-token: write   # OIDC token for nuget.org trusted publishing (NuGet/login). This job only.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # source link wants the full history

      # Refuse to release a tag whose commit's CI hasn't passed (TAM-84 + branch protection).
      # Skipped on workflow_dispatch — that path is the manual override
      # for land-grabs / out-of-band publishes.
      - name: Wait for CI to pass on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          SHA="${{ github.sha }}"
          echo "Waiting for CI workflow run on commit $SHA"
          for i in $(seq 1 60); do
            result=$(gh run list --workflow CI --commit "$SHA" --json status,conclusion --jq '.[0] // empty')
            if [ -z "$result" ]; then
              echo "  (no CI run for this commit yet — attempt $i/60, sleeping 10s)"
              sleep 10
              continue
            fi
            status=$(echo "$result" | jq -r '.status')
            conclusion=$(echo "$result" | jq -r '.conclusion // ""')
            echo "  CI status=$status conclusion=$conclusion (attempt $i/60)"
            if [ "$status" != "completed" ]; then
              echo "  (CI still running, sleeping 10s)"
              sleep 10
              continue
            fi
            if [ "$conclusion" = "success" ]; then
              echo "✓ CI passed on $SHA — proceeding with release"
              exit 0
            fi
            echo "::error::CI conclusion is '$conclusion' on commit $SHA. Refusing to release."
            exit 1
          done
          echo "::error::Timed out waiting for CI to complete on commit $SHA after 10 minutes."
          exit 1

      - name: Install supported .NET SDKs
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      # Tag is the source of truth for shipped versions. Strips the
      # leading "v" (so v0.1.0 → 0.1.0). PACKAGE_VERSION flows through
      # to the Build.cs Pack target via the [Parameter(EnvironmentVariable)]
      # binding on the Version property.
      - name: Resolve version from tag
        if: github.event_name == 'push'
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The dogfood: install Tamp's CLI tool. The "dotnet-tamp" package
      # exposes `dotnet tamp <target>` — we pin to 1.0.0 explicitly so
      # the build is reproducible.
      - name: Install Tamp (the framework being dogfooded)
        run: dotnet tool install --global dotnet-tamp --version 1.0.0

      # Run the full CI pipeline (Info → Clean → Restore → Compile →
      # Test → Pack) through Tamp's own target graph. The Build.cs in
      # ./build is auto-discovered by Tamp.Cli walking up from CWD.
      - name: tamp Ci
        run: dotnet tamp Ci

      - name: List packages
        run: ls -la ./artifacts/

      # Push runs on tag push always, and on workflow_dispatch only when
      # dry_run is explicitly false. The Push target depends on Pack so
      # this step re-runs Compile / Test / Pack — a few extra seconds in
      # exchange for keeping the target graph dependency-honest.
      #
      # Auth is nuget.org trusted publishing (OIDC): NuGet/login exchanges the
      # job's short-lived id-token for a temporary API key, so there is no
      # long-lived secret to expire or rotate. The policy on nuget.org is
      # pinned to this repo, this workflow file and the 'release' environment.
      - name: NuGet login (OIDC -> temp API key)
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: BrewingCoder

      - name: tamp Push
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet tamp Push

      # A published version with no GitHub Release leaves the Releases tab advertising an old
      # version, notifies nobody watching the repo, and gives a reader nowhere to land. The notes
      # come out of CHANGELOG.md, which stays the single source of truth — the Release is derived,
      # so it cannot drift from the repo. Only on a tag push: a manual dispatch has no tag.
      # (tamp#159, tamp#164)
      - name: GitHub Release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          notes=notes.md
          if ! bash .github/scripts/changelog-section.sh "$version" CHANGELOG.md > "$notes"; then
            # No section is worth surfacing, but not worth failing a release that already pushed to
            # nuget.org — the packages are public and irreversible by this point.
            echo "::warning::No CHANGELOG.md section for $version; creating the Release without notes."
            printf 'No changelog section was found for %s. See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md).\n' \
              "$version" "$GITHUB_REPOSITORY" > "$notes"
          fi

          {
            echo ""
            echo "---"
            echo ""
            echo "Packages for this release are on [nuget.org](https://www.nuget.org/profiles/Tamp), and the attached \`.nupkg\` files are the exact artifacts that were pushed."
          } >> "$notes"

          # Idempotent: re-running a release edits the existing Release rather than failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$notes" --title "$version"
          else
            gh release create "$TAG" --notes-file "$notes" --title "$version" --verify-tag
          fi

          shopt -s nullglob
          packages=(./artifacts/*.nupkg)
          if [[ ${#packages[@]} -gt 0 ]]; then
            gh release upload "$TAG" "${packages[@]}" --clobber
          fi

          echo "Release: $(gh release view "$TAG" --json url --jq .url)"

          # Announce the shipped version on every issue this release carries. A closing comment
          # cannot do it when the issue is closed before the release exists.
          bash .github/scripts/announce-release.sh "$TAG" "$notes" || \
            echo "::warning::Issue announcements failed; the release itself is unaffected."

      - name: Dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          echo "DRY RUN — would have pushed:"
          ls -la ./artifacts/*.nupkg
          echo ""
          echo "Re-run with dry_run=false to actually publish."

      - name: Upload packages as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ./artifacts/*.nupkg
          if-no-files-found: error
